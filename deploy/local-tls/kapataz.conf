# Proxy TLS del entorno local (docs/operacion/https-local.md).
#
# Reproduce el bloque del nginx de KronoQR de docs/operacion/despliegue.md
# §10, para probar en local la misma configuración de proxy que en
# producción. Si cambias aquel bloque, cambia también este, y al revés.
#
# Diferencias con producción, todas por ser local:
# - Escucha en 8443 sin root y sin el servidor del puerto 80; una petición
#   HTTP al 8443 se redirige a HTTPS (error_page 497).
# - Certificado de mkcert en /etc/nginx/tls (carpeta .local-tls/, fuera de
#   git y de la imagen), en vez del de Let's Encrypt.
# - Host con $http_host en vez de $host: en local el puerto no es el 443 y
#   $host lo pierde, así que las URL que construya la app se irían al 443.
# - Sin log de acceso, que registraría la IP de cada dispositivo de la red,
#   y sin la versión de nginx en las respuestas.

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HTTP plano en el puerto TLS: a HTTPS.
    error_page 497 =301 https://$http_host$request_uri;

    access_log off;
    server_tokens off;

    # No añadas Strict-Transport-Security aquí: la pone la app.

    # Subidas de PDF (Bloque 4) y audio (Bloque 9); la app aplica límites
    # menores por endpoint.
    client_max_body_size 50m;

    # Resolver interno de Docker. Con la dirección en una variable, nginx
    # resuelve «kapataz» al atender cada petición y no al arrancar: así
    # nginx arranca aunque Kapataz no exista todavía, y sigue la IP nueva
    # cuando Docker recrea el contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $kapataz_upstream http://kapataz:8000;

    location / {
        proxy_pass $kapataz_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE del chat: sin búfer ni caché, y conexiones largas.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
