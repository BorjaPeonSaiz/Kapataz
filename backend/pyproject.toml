[project]
name = "kapataz"
version = "0.0.0"
description = "Asistente con IA para autónomos de oficio: consulta, presupuestos y facturas."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    # FastAPI y uvicorn van fijados: el contrato OpenAPI exportado y el
    # comportamiento de --forwarded-allow-ips (rangos CIDR, ADR-014) dependen
    # de la versión exacta.
    "fastapi==0.162.5",
    "httptools>=0.9.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn==0.54.0",
    "uvloop>=0.23.0 ; sys_platform != 'win32'",
]

[project.scripts]
kapataz-admin = "kapataz.admin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kapataz"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    # Faker, ReportLab, pypdfium2 y Pillow van fijados: sus datos y su salida
    # cambian entre versiones, y los documentos sintéticos versionados (ADR-020)
    # dependen de ellas (los escaneados, de la rasterización y del JPEG).
    "faker==40.54.0",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pillow==13.0.0",
    "pip-audit>=2.10.1",
    "pypdfium2==5.15.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab==5.1.0",
    "ruff>=0.17.4",
    "types-reportlab>=5.1.0.20261104",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]
extend-exclude = ["src/kapataz/static"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "W",
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "A",     # builtins
    "C4",    # comprehensions
    "DTZ",   # datetimes sin zona
    "T10",   # debugger
    "T20",   # print
    "EM",    # mensajes de excepción
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "PT",    # pytest
    "Q",
    "RSE",
    "RET",
    "SIM",
    "TID",   # tidy-imports (banned-api)
    "TC",    # imports solo de tipos
    "ARG",
    "PTH",
    "ERA",   # código comentado
    "PGH",
    "PL",    # pylint
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "RUF",
    "S",     # bandit
    "ASYNC",
    "BLE",
    "FBT",
    "SLF",
    "ANN",
]
ignore = [
    "PLR0913",  # los casos de uso reciben sus puertos por constructor
    "TRY003",   # mensajes de error cortos en el sitio
    "EM101",
    "FLY002",   # las políticas de cabeceras se leen mejor como lista unida
    "RUF001",   # textos en español con signos tipográficos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR-001: el tiempo entra por el puerto Clock. Solo SystemClock lee el reloj.
"datetime.datetime.now".msg = "Usa el puerto Clock (ADR-001)."
"datetime.datetime.utcnow".msg = "Usa el puerto Clock (ADR-001)."
"datetime.date.today".msg = "Usa el puerto Clock (ADR-001)."

[tool.ruff.lint.per-file-ignores]
"src/kapataz/infrastructure/clock.py" = ["TID251"]
"tests/**" = ["S101", "S105", "S106", "S608", "ARG002", "RUF012", "PLR2004", "ANN", "SLF001", "FBT", "ARG001", "S311"]
"tools/**" = ["T201"]
"alembic/**" = ["ANN", "ERA001", "S608"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
# El paquete y las herramientas, en modo estricto. Las pruebas quedan fuera por ahora
# (pendiente en HANDOFF.md).
files = ["src/kapataz", "tools"]
plugins = ["pydantic.mypy"]

# pypdfium2 no publica tipos: solo lo usa el generador de datos sintéticos (tools/).
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# asyncpg no publica tipos: solo tools/seed_demo.py lo importa, para capturar los
# errores de conexión que SQLAlchemy no envuelve (S3-08).
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- import-linter

[tool.importlinter]
root_packages = ["kapataz"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas hexagonales (ADR-001, arquitectura §3)"
type = "layers"
layers = [
    "kapataz.api",
    "kapataz.infrastructure",
    "kapataz.application",
    "kapataz.domain",
]

[[tool.importlinter.contracts]]
name = "El dominio es Python puro (ADR-001)"
type = "forbidden"
source_modules = ["kapataz.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "anthropic",
    "stripe",
    "procrastinate",
    "asyncpg",
    "pydantic",
    "pydantic_settings",
    "argon2",
    "structlog",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "La aplicación no conoce frameworks ni adaptadores (ADR-001)"
type = "forbidden"
source_modules = ["kapataz.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "anthropic",
    "stripe",
    "procrastinate",
    "asyncpg",
    "pydantic_settings",
    "argon2",
    "structlog",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "La API no usa los casos de uso de administración (S3-09)"
type = "forbidden"
source_modules = ["kapataz.api"]
forbidden_modules = ["kapataz.application.use_cases.admin"]

# El núcleo crea el espacio de la cuenta que recibe. La API llega a él solo a
# través de LoadDemoSpace, que toma la cuenta del usuario autenticado: se
# admite el import indirecto y se prohíbe el directo.
[[tool.importlinter.contracts]]
name = "La API carga el espacio de demostración solo de la cuenta de la sesión (S3-R-03)"
type = "forbidden"
source_modules = ["kapataz.api"]
forbidden_modules = ["kapataz.application.use_cases.demo_space_loader"]
allow_indirect_imports = true

# tools/ no es un paquete de kapataz: sus módulos se ven como externos
# (include_external_packages), con el nombre con el que se importarían.
[[tool.importlinter.contracts]]
name = "La app no importa el generador sintético de tools/ (ADR-020)"
type = "forbidden"
source_modules = ["kapataz"]
forbidden_modules = ["synthetic", "gen_synthetic", "seed_demo", "tools"]

# ---------------------------------------------------------------- bandit

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# tools/ está en la ruta para importar el generador de datos sintéticos (synthetic).
pythonpath = [".", "tools"]
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette 1.10 recomienda httpx2 para su TestClient; el plan fija httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
markers = [
    "req(id): requisito de docs/01-especificacion.md que cubre la prueba (RF-, RN-, RNF-).",
    "owasp(id): categoría OWASP Top 10 o LLM Top 10 que cubre la prueba (ADR-021).",
    "llm: evaluación contra la API real de Claude; nunca en CI (ADR-008).",
    "slow: prueba lenta.",
]

# ---------------------------------------------------------------- mutmut

# Mutación sobre domain/billing (ADR-009, ADR-033; objetivo >= 80 %). Corre a
# mano en GitHub Actions (.github/workflows/mutacion.yml). mutmut 3 no funciona
# en Windows nativo: en local, con WSL o Docker. Se copia todo src/ para que el
# paquete se importe entero desde mutants/, pero solo se muta billing.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/kapataz/domain/billing/*"]
pytest_add_cli_args_test_selection = ["tests/unit/domain/"]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["kapataz"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
