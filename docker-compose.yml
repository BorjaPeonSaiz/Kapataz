# Kapataz en producción (ADR-014). Proyecto de Compose: kapataz.
#
# En el servidor no se llama a docker compose a mano con este fichero:
# deploy/compose.sh fija la etiqueta de la imagen desplegada y el proyecto.
# En local se combina siempre, de forma explícita, con docker-compose.local.yml
# (docs/operacion/despliegue.md).
#
# - Ningún servicio publica puertos. El único acceso desde fuera es el nginx
#   de KronoQR, que llega a http://kapataz:8000 por la red kronoqr-app.
# - kapataz-db solo está en kapataz-internal (internal: true): ni sale a
#   internet ni es accesible desde kronoqr-app.
# - La imagen kapataz:<etiqueta> se construye en el propio servidor y nunca se
#   descarga de un registro (pull_policy: never). Nunca latest.

name: kapataz

x-kapataz-app: &kapataz-app
  image: "kapataz:${KAPATAZ_IMAGE_TAG:?Falta KAPATAZ_IMAGE_TAG; usa deploy/compose.sh o deploy/local-up.sh}"
  pull_policy: never
  restart: unless-stopped
  env_file:
    - ${KAPATAZ_ENV_FILE:-.env}
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - kapataz-uploads:/data/uploads
  logging: &kapataz-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Los contenedores de la app no necesitan las contraseñas de PostgreSQL: se
# vacían aunque estén en .env (solo sirven para kapataz-db y para componer
# las URL de conexión).
#
# Rol propietario (kapataz_owner, no sujeto a RLS; ADR-024): su URL no está en
# .env. Solo la recibe kapataz-tools, que la compone abajo para Alembic. Aquí
# se vacía también, por si un .env antiguo aún la trae: kapataz y
# kapataz-worker nunca la reciben. Lo comprueba deploy/check-compose-env.sh
# en el CI.
x-kapataz-app-environment: &kapataz-app-environment
  POSTGRES_PASSWORD: ""
  KAPATAZ_OWNER_DB_PASSWORD: ""
  KAPATAZ_APP_DB_PASSWORD: ""
  DATABASE_MIGRATION_URL: ""

services:
  kapataz:
    <<: *kapataz-app
    environment:
      <<: *kapataz-app-environment
    depends_on:
      kapataz-db:
        condition: service_healthy
    networks:
      - kapataz-internal
      - kapataz-egress
      - kronoqr-app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
          pids: 256

  kapataz-worker:
    <<: *kapataz-app
    command: ["python", "-m", "kapataz.worker"]
    environment:
      <<: *kapataz-app-environment
    depends_on:
      kapataz-db:
        condition: service_healthy
    networks:
      - kapataz-internal
      - kapataz-egress
    # Hasta que el worker tenga su propio latido (Bloque 4, ADR-026), se
    # comprueba que el proceso principal es el worker.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.exit(0 if b'kapataz.worker' in open('/proc/1/cmdline', 'rb').read() else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 60s
    # El VPS se comparte con KronoQR: el worker (OCR, embeddings y, desde el
    # Bloque 9, Whisper) no puede quedarse con toda la CPU ni la memoria.
    # Se revisan con las mediciones de RNF-14 y RNF-16.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m
          pids: 256
        reservations:
          memory: 256m

  # Tareas puntuales con la misma imagen: migraciones y kapataz-admin.
  # No arranca con «up»; se usa con «run --rm». Solo ve la base de datos.
  # Es el único contenedor de la app con la URL del rol propietario, que
  # backend/alembic/env.py lee de DATABASE_MIGRATION_URL.
  kapataz-tools:
    <<: *kapataz-app
    restart: "no"
    profiles: ["tools"]
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *kapataz-app-environment
      DATABASE_MIGRATION_URL: "postgresql+asyncpg://kapataz_owner:${KAPATAZ_OWNER_DB_PASSWORD:?Falta KAPATAZ_OWNER_DB_PASSWORD}@kapataz-db:5432/kapataz"
    depends_on:
      kapataz-db:
        condition: service_healthy
    networks:
      - kapataz-internal
    healthcheck:
      disable: true

  kapataz-db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    # Sin env_file: el contenedor de la base de datos no recibe la clave de
    # sesión ni la de la API de Claude; solo lo suyo.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kapataz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      KAPATAZ_OWNER_DB_PASSWORD: ${KAPATAZ_OWNER_DB_PASSWORD:?Falta KAPATAZ_OWNER_DB_PASSWORD}
      KAPATAZ_APP_DB_PASSWORD: ${KAPATAZ_APP_DB_PASSWORD:?Falta KAPATAZ_APP_DB_PASSWORD}
    volumes:
      - kapataz-db-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - kapataz-internal
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    healthcheck:
      # Por TCP: durante la inicialización PostgreSQL solo escucha en el
      # socket, así que no se da por sano antes de tiempo.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=kapataz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *kapataz-logging

networks:
  # Base de datos y tráfico interno. Sin salida a internet.
  kapataz-internal:
    name: kapataz-internal
    internal: true
  # Salida a internet de la api y del worker (API de Claude, SMTP...).
  kapataz-egress:
    name: kapataz-egress
  # Red del nginx de KronoQR. La crea KronoQR; aquí solo se une kapataz.
  kronoqr-app:
    name: kronoqr-app
    external: true

volumes:
  # Nombres fijos: no dependen del nombre del proyecto y no se pierden si
  # alguien lanza Compose con otro -p.
  kapataz-db-data:
    name: kapataz-db-data
  kapataz-uploads:
    name: kapataz-uploads
