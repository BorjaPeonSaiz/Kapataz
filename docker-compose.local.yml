# Ajustes para el entorno local. Se usa SIEMPRE de forma explícita, nunca con
# el nombre de override automático de Compose:
#
#   sh deploy/local-up.sh                     # http://localhost:8000
#   sh deploy/local-up.sh --https <IP local>  # https://<IP local>:8443
#
# o, a mano:
#
#   docker compose --env-file .env.local \
#     -f docker-compose.yml -f docker-compose.local.yml <orden>
#
# La red kronoqr-app no existe en local: deploy/local-up.sh la crea vacía si
# falta. Datos sintéticos únicamente; nunca claves de producción.
#
# Modo HTTPS (docs/operacion/https-local.md): perfil «https», que añade
# kapataz-local-tls, y las variables KAPATAZ_LOCAL_* de abajo, que fija
# deploy/local-up.sh. Sin ellas, los valores por defecto son los del modo
# HTTP en localhost.

services:
  kapataz:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    # Solo en local y solo en el bucle local del portátil, en los dos modos.
    ports:
      - "127.0.0.1:8000:8000"
    environment: &kapataz-local-environment
      APP_ENV: local
      COOKIE_SECURE: ${KAPATAZ_LOCAL_COOKIE_SECURE:-false}
      EMAIL_BACKEND: fake
      PUBLIC_BASE_URL: ${KAPATAZ_LOCAL_PUBLIC_BASE_URL:-http://localhost:8000}
      # En modo HTTPS, la subred real de kronoqr-app en el portátil; nunca *.
      FORWARDED_ALLOW_IPS: ${KAPATAZ_LOCAL_FORWARDED_ALLOW_IPS:-127.0.0.1}

  kapataz-worker:
    environment: *kapataz-local-environment

  kapataz-tools:
    environment: *kapataz-local-environment

  # Proxy TLS solo para local: reproduce el nginx de KronoQR de producción
  # (despliegue.md §10) con un certificado de mkcert, para entrar por HTTPS
  # desde el portátil y desde el móvil en la red local. Solo con el perfil
  # https. Como en producción, está solo en kronoqr-app y llega a
  # http://kapataz:8000 por nombre; no depende de kapataz.
  kapataz-local-tls:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    container_name: kapataz-local-tls
    profiles: ["https"]
    restart: unless-stopped
    # Solo en el bucle local y en la IP de la red local que se pasa a
    # deploy/local-up.sh; en ninguna otra interfaz del portátil.
    ports:
      - "127.0.0.1:8443:8443"
      - "${KAPATAZ_LOCAL_LAN_IP:-127.0.0.1}:8443:8443"
    volumes:
      - ./deploy/local-tls/kapataz.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local-tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./.local-tls/key.pem:/etc/nginx/tls/key.pem:ro
    networks:
      - kronoqr-app
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Comprueba la cadena entera: TLS, proxy y /api/health de la app.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "--max-time", "4", "--output", "/dev/null", "https://127.0.0.1:8443/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64m
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
